[package]
name = "vatio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Spain's electricity prices and grid status in your terminal, for people and AI agents. No API key."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Evarodenas/vatio"
readme = "README.md"
keywords = ["electricity", "spain", "pvpc", "energy", "mcp"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/RELEASING.md", "/deny.toml", "/dist-workspace.toml"]

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
jiff = { version = "1", features = ["tzdb-bundle-always", "serde"] }
# TLS through rustls with the `ring` provider: no aws-lc C build, so every release
# target compiles with a plain toolchain.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "system-proxy"] }
rmcp = { version = "3.12", default-features = false, features = ["base64", "macros", "server", "transport-io", "schemars"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "io-std", "time"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

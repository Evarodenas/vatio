name: Live check

# Verification against the live REData API from a GitHub runner. Pushing to the
# `live-check` branch runs it once and commits what it saw under `live/`: vatio's own
# output for each command, and raw API answers to replace the transcribed fixtures.
on:
  push:
    branches: [live-check]

permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

      - name: Run vatio against the live API
        run: |
          mkdir -p live/raw
          export VATIO_CACHE_DIR="$RUNNER_TEMP/vatio-cache"
          V=./target/debug/vatio
          date -u +"%Y-%m-%dT%H:%M:%SZ" > live/started_at.txt

          # JSON form first (up to 4 tries when the failure is network/bot wall,
          # exit code 4), then the human form, which should come from the cache.
          run() {
            local name="$1"; shift
            local code=0 attempt
            for attempt in 1 2 3 4; do
              code=0
              "$V" "$@" --json > "live/$name.json" 2> "live/$name.stderr" || code=$?
              [ "$code" != 4 ] && break
              sleep 8
            done
            echo "exit=$code attempts=$attempt" > "live/$name.exit"
            "$V" "$@" > "live/$name.txt" 2>> "live/$name.stderr" || true
          }

          run now               now
          run now_spot          now --market spot
          run prices_today      prices
          run prices_tomorrow   prices tomorrow
          run prices_yesterday  prices yesterday
          run prices_spot_today prices --market spot
          run prices_spot_hourly_era prices 2025-06-01 --market spot
          run prices_25h_day    prices 2026-10-25
          run prices_23h_day    prices 2026-03-29
          run cheapest_3h       cheapest 3h
          run cheapest_2h_by_8  cheapest 2h --until 08:00 --top 3
          run cheapest_spot_90m cheapest 90m --market spot
          run grid              grid
          run prices_far_future prices 2030-01-01
          # The outlook: first on a cache holding only what the commands above fetched, then again.
          ls "$VATIO_CACHE_DIR" | wc -l > live/outlook_cache_files_before.txt
          run outlook_3h        outlook 3h
          ls "$VATIO_CACHE_DIR" | wc -l > live/outlook_cache_files_after.txt
          run outlook_3h_again  outlook 3h
          run outlook_90m       outlook 90m
          run outlook_8h        outlook 8h
          ls -la "$VATIO_CACHE_DIR" > live/cache_listing.txt 2>&1 || true

      - name: Commit what was seen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          git commit -m "Live check: results from the REData API" || echo "nothing to commit"
          git push

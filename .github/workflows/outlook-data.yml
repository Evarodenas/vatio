name: Outlook data

# Collects the history used to backtest a multi-day price outlook: prices, generation
# and demand from REData, and archived weather forecasts from Open-Meteo. Pushing to
# the `outlook-data` branch runs it and commits the CSV files under `data/`.
on:
  push:
    branches: [outlook-data]

permissions:
  contents: write

concurrency:
  group: outlook-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Collect
        run: |
          mkdir -p data
          ONLY=$(cat data/ONLY 2>/dev/null || echo prices,mix,demand,weather)
          python3 tools/fetch_outlook_data.py data 2025-01-01 2026-11-26 "$ONLY"
          ls -la data
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Outlook data: prices, generation, demand and weather forecasts" || echo "nothing to commit"
          git push

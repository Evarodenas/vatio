name: Outlook data

# Collects the history used to backtest a multi-day price outlook: prices, generation
# and demand from REData, and archived weather forecasts from Open-Meteo. Pushing to
# it by hand, or changing `data/REQUEST` on this branch, commits the CSV files under `data/`.
on:
  workflow_dispatch:
  push:
    branches: [outlook-data]
    paths: [data/REQUEST]

permissions:
  contents: write

concurrency:
  group: outlook-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Collect
        run: |
          # What to fetch is written in data/REQUEST: output folder, first day, last day, datasets.
          read -r OUT START END ONLY < data/REQUEST
          mkdir -p "data/$OUT"
          python3 tools/fetch_outlook_data.py "data/$OUT" "$START" "$END" "$ONLY"
          ls -la "data/$OUT"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Outlook data: prices, generation, demand and weather forecasts" || echo "nothing to commit"
          git push

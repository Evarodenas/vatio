name: Outlook data

# Collects the history used to backtest a multi-day price outlook: prices, generation
# and demand from REData, and archived weather forecasts from Open-Meteo. Pushing to
# it by hand from the Actions tab commits the CSV files under `data/`.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outlook-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Collect
        run: |
          # Second pass: the year before, kept in its own folder so the first pass is not overwritten.
          mkdir -p data/y2024
          python3 tools/fetch_outlook_data.py data/y2024 2024-01-01 2024-12-31 prices,mix,demand,weather
          ls -la data data/y2024
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Outlook data: prices, generation, demand and weather forecasts" || echo "nothing to commit"
          git push
